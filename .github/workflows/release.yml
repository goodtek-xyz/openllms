# Release: a pushed tag vX.Y.Z on a commit of main builds the llms CLI from that tree and publishes it as a GitHub
# Release with SHA256SUMS and build provenance (artifact attestations).
#
# Order: secret scan of the full history → the tag must be on main → tests → build → checksums → attestation →
# Release. Any failure stops before anything is published.
#
# Verify a download:
#   shasum -a 256 -c SHA256SUMS --ignore-missing
#   gh attestation verify llms_<os>_<arch> --repo goodtek-xyz/openllms
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  secret-scan:
    name: Secret scan · gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      # sha256 of gitleaks_8.30.1_linux_x64.tar.gz; must also match the release's checksums file.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (pinned release, checksum verified)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          workdir="$(mktemp -d)"
          cd "$workdir"
          curl -sSfLO "${base}/${tarball}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep -E "^[0-9a-f]{64}  ${tarball}\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" > release.sha256
          echo "${GITLEAKS_SHA256}  ${tarball}" > pinned.sha256
          cmp release.sha256 pinned.sha256
          sha256sum -c pinned.sha256
          tar -xzf "${tarball}" gitleaks
          install -m 0755 gitleaks "${RUNNER_TEMP}/gitleaks"
          "${RUNNER_TEMP}/gitleaks" version
      - name: Compose config (.gitleaks.toml + shared rules)
        run: |
          set -euo pipefail
          config="${RUNNER_TEMP}/gitleaks.toml"
          cat .gitleaks.toml > "$config"
          printf '\n' >> "$config"
          cat >> "$config" <<'GITLEAKS_SHARED_RULES'
          # PHP database credentials passed as a literal: the third argument of `new mysqli(host, user, password, ...)`
          # or `new PDO(dsn, user, password)`. A variable or a call (`$pass`, `getenv(...)`) is not a literal and is
          # not reported; nor is a literal shorter than 6 characters.
          [[rules]]
          id = "php-db-credential-argument"
          description = "PHP mysqli/PDO constructor with a literal password argument"
          regex = '''(?i)\bnew\s+(?:mysqli|PDO)\s*\(\s*(?:'[^']*'|"[^"]*")\s*,\s*(?:'[^']*'|"[^"]*")\s*,\s*['"]([^'"\s$]{6,})['"]'''
          secretGroup = 1
          keywords = ["mysqli", "pdo"]

          # The same for the procedural and method forms: `mysqli_connect(host, user, password, ...)` and
          # `$mysqli->real_connect(host, user, password, ...)`.
          [[rules]]
          id = "php-mysqli-connect-password"
          description = "PHP mysqli_connect/real_connect with a literal password argument"
          regex = '''(?i)\b(?:mysqli_connect|real_connect)\s*\(\s*(?:['"][^'"]*['"]\s*,\s*){2}['"]([^'"\s$]{6,})['"]'''
          secretGroup = 1
          keywords = ["mysqli_connect", "real_connect"]
          GITLEAKS_SHARED_RULES
      - name: Scan full history
        run: |
          "${RUNNER_TEMP}/gitleaks" git --config "${RUNNER_TEMP}/gitleaks.toml" --redact --no-banner --exit-code 1 .

  release:
    name: Build and publish
    needs: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the Release
      id-token: write # sign the attestation (Sigstore)
      attestations: write # store the attestation
      artifact-metadata: write # artifact storage record (actions/attest)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag must be vX.Y.Z on main
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag ${TAG} is not vX.Y.Z"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::tag ${TAG} (${GITHUB_SHA}) is not on main"
            exit 1
          fi
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: go test ./...
      - name: Build CLI (linux, darwin × amd64, arm64)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          short="$(git rev-parse --short=12 HEAD)"
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            goos="${t%/*}" goarch="${t#*/}"
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags "-s -w -X main.Version=${TAG} -X main.Commit=${short}" \
              -o "dist/llms_${goos}_${goarch}" ./cmd/llms
          done
          (cd dist && sha256sum llms_*_* > SHA256SUMS)
          cat dist/SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/llms_*
      - name: Release notes (commits since the previous tag)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          prev="$(git describe --tags --abbrev=0 --match 'v*.*.*' "${GITHUB_SHA}^" 2>/dev/null || true)"
          range="${prev:+${prev}..}${GITHUB_SHA}"
          {
            echo "## Changes${prev:+ since ${prev}}"
            echo
            git log --no-merges --format='### %s%n%n%b' "$range" | grep -v '^Source-Commit:'
            echo
            echo "## Verify"
            echo
            echo '```bash'
            echo 'shasum -a 256 -c SHA256SUMS --ignore-missing'
            echo "gh attestation verify llms_<os>_<arch> --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } > "${RUNNER_TEMP}/notes.md"
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/llms_* dist/SHA256SUMS --verify-tag --title "openllms ${TAG}" --notes-file "${RUNNER_TEMP}/notes.md"
